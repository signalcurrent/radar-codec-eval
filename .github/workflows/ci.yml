name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Round-trip invertibility tests
        run: python tests/test_roundtrip.py
      - name: Smoke test (BAQ known-answer, no data required)
        run: python tests/test_smoke.py
      - name: Figure regeneration from committed results log
        run: python scripts/plot_curves.py
